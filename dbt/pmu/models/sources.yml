version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: raw_course
        description: "Table brute des fichiers course"
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: source_file
            tests:
              - not_null
          - name: file_hash
            tests:
              - not_null
          - name: json_data
            tests:
              - not_null
          - name: ingested_at
            tests:
              - not_null

      - name: raw_participant
        description: "Table brute des fichiers participant"
        columns:
          - name: id
            tests:
              - unique
              - not_null
          - name: source_file
            tests:
              - not_null
          - name: file_hash
            tests:
              - not_null
          - name: json_data
            tests:
              - not_null
          - name: ingested_at
            tests:
              - not_null

  - name: analytics_marts
    description: "Tables écrites par le pipeline d'inférence (API FastAPI)"
    schema: analytics_marts
    tables:
      - name: dim_prediction
        description: "Prédictions stockées par le DAG pmu_daily_predict"
        columns:
          - name: race_id
            tests:
              - not_null
          - name: horse_id
            tests:
              - not_null
          - name: prediction_date
            tests:
              - not_null
          - name: model_run
            tests:
              - not_null
          - name: pred_score
            tests:
              - not_null